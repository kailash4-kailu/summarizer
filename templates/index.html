<!doctype html>
<html>
<head>
  <title>AI Summarizer</title>
  <style>
    body {
      font-family: Arial;
      max-width: 800px;
      margin: 40px auto;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
    }

    button {
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
    }

    #result {
      background: #f4f4f4;
      padding: 10px;
      margin-top: 15px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h1>AI Summarizer</h1>

  <textarea id="text" placeholder="Paste text here..."></textarea><br>
  <button onclick="summarize()">Summarize</button>

  <h3>Summary:</h3>
  <div id="result"></div>

<script>
async function summarize() {
  const text = document.getElementById("text").value;

  const res = await fetch("/summarize", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text })
  });

  const data = await res.json();
  document.getElementById("result").innerText = data.summary;
}
</script>

</body>
</html>
